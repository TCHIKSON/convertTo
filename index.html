<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertisseur Markdown</title>
<meta name="description" content="Convertir des fichiers PDF, Word et Excel en Markdown, directement dans le navigateur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #e2e5ea;
    --text: #1d2330;
    --muted: #667085;
    --primary: #2f5bea;
    --primary-hover: #2549c4;
    --primary-soft: #eaf0ff;
    --success: #1f8a4c;
    --danger: #c8372d;
    --pdf: #c8372d;
    --word: #2b5bb8;
    --excel: #1f7a45;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218;
      --surface: #171b23;
      --surface-2: #1e232d;
      --border: #2a303c;
      --text: #e6e9ef;
      --muted: #8d96a8;
      --primary: #5b80f5;
      --primary-hover: #7593f7;
      --primary-soft: #1d2640;
      --success: #3fb36f;
      --danger: #e5625a;
      --pdf: #e5625a;
      --word: #6f97e6;
      --excel: #45b377;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 16px 64px; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .logo {
    width: 40px; height: 40px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--primary); color: #fff; font-size: 18px; flex: none;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: var(--muted); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }

  /* Zone de dépôt */
  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 40px 16px; text-align: center; cursor: pointer;
    border: 1.5px dashed var(--border); border-radius: var(--radius);
    background: var(--surface); transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop:focus-visible { border-color: var(--primary); outline: none; }
  .drop.over { border-color: var(--primary); background: var(--primary-soft); }
  .drop .pi-cloud-upload { font-size: 32px; color: var(--primary); }
  .drop strong { font-weight: 600; font-size: 15px; }
  .drop span { color: var(--muted); }
  .formats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
  }
  .privacy {
    display: flex; align-items: center; gap: 8px; margin: 12px 2px 0;
    color: var(--muted); font-size: 13px;
  }

  /* Liste des fichiers */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .toolbar h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .toolbar .count { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #files-card { margin-top: 24px; }
  ul.files { list-style: none; margin: 0; padding: 0; }
  .file {
    display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .file:last-child { border-bottom: 0; }
  .file:hover { background: var(--surface-2); }
  .file.active { background: var(--primary-soft); }
  .ficon {
    width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
    background: var(--surface-2); font-size: 17px;
  }
  .ficon.pdf { color: var(--pdf); } .ficon.word { color: var(--word); } .ficon.excel { color: var(--excel); }
  .fname { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fmeta { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .fmeta .ok { color: var(--success); } .fmeta .err { color: var(--danger); }
  .fmain { min-width: 0; }
  .fact { display: flex; gap: 4px; }

  /* Boutons */
  .btn {
    display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font: inherit; font-weight: 500; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .icon-btn {
    width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px;
    border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn:disabled { opacity: .35; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* Aperçu */
  #preview-card { margin-top: 24px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    border: 0; background: var(--surface); color: var(--muted); font: inherit; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--surface-2); color: var(--text); font-weight: 500; }
  .preview-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .preview-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  pre.source {
    margin: 0; padding: 16px; max-height: 520px; overflow: auto;
    font: 12.5px/1.6 "JetBrains Mono", ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;
  }
  .rendered { padding: 8px 24px 20px; max-height: 520px; overflow: auto; }
  .rendered table { border-collapse: collapse; margin: 12px 0; font-size: 13px; display: block; overflow-x: auto; }
  .rendered th, .rendered td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .rendered th { background: var(--surface-2); font-weight: 600; }
  .rendered h1, .rendered h2, .rendered h3 { letter-spacing: -.01em; }
  .rendered code { font-family: "JetBrains Mono", monospace; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
  .rendered hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }

  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }
  .hidden { display: none !important; }

  /* Notification */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px;
    background: var(--text); color: var(--bg); font-weight: 500; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }

  @media (max-width: 600px) {
    .wrap { padding-top: 24px; }
    .file { grid-template-columns: 32px 1fr; }
    .fact { grid-column: 1 / -1; justify-content: flex-end; }
    .rendered { padding: 4px 16px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i class="pi pi-file-export"></i></div>
    <div>
      <h1>Convertisseur Markdown</h1>
      <p>PDF, Word et Excel vers Markdown</p>
    </div>
  </header>

  <label class="drop" id="drop" tabindex="0">
    <i class="pi pi-cloud-upload"></i>
    <strong>Déposez vos fichiers ici</strong>
    <span>ou cliquez pour parcourir</span>
    <div class="formats">
      <span class="tag"><i class="pi pi-file-pdf"></i>PDF</span>
      <span class="tag"><i class="pi pi-file-word"></i>DOCX</span>
      <span class="tag"><i class="pi pi-file-excel"></i>XLSX, XLS, ODS, CSV</span>
    </div>
    <input type="file" id="input" multiple hidden
      accept=".pdf,.docx,.xlsx,.xlsm,.xls,.ods,.csv">
  </label>
  <div class="privacy"><i class="pi pi-shield"></i>Conversion locale dans votre navigateur. Aucun fichier n'est envoyé ni conservé.</div>

  <section class="card hidden" id="files-card">
    <div class="toolbar">
      <h2>Fichiers<span class="count" id="count"></span></h2>
      <div class="actions">
        <button class="btn" id="clear"><i class="pi pi-trash"></i>Tout effacer</button>
        <button class="btn primary" id="zip" disabled><i class="pi pi-download"></i>Tout télécharger (.zip)</button>
      </div>
    </div>
    <ul class="files" id="list"></ul>
  </section>

  <section class="card hidden" id="preview-card">
    <div class="toolbar">
      <div class="preview-title"><i class="pi pi-eye"></i><span id="preview-name"></span></div>
      <div class="actions">
        <div class="seg" role="tablist">
          <button id="tab-src" class="on"><i class="pi pi-code"></i>Source</button>
          <button id="tab-render"><i class="pi pi-align-left"></i>Rendu</button>
        </div>
        <button class="btn" id="p-copy"><i class="pi pi-copy"></i>Copier</button>
        <button class="btn primary" id="p-dl"><i class="pi pi-download"></i>.md</button>
      </div>
    </div>
    <pre class="source" id="source"></pre>
    <div class="rendered hidden" id="rendered"></div>
  </section>

  <footer>Traitement 100 % local · pdf.js · mammoth · SheetJS · Turndown</footer>
</div>

<div id="toast" role="status" aria-live="polite"><i class="pi pi-check"></i><span></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(() => {
  "use strict";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const TYPES = {
    pdf:  { kind: "pdf",   icon: "pi-file-pdf" },
    docx: { kind: "word",  icon: "pi-file-word" },
    xlsx: { kind: "excel", icon: "pi-file-excel" },
    xlsm: { kind: "excel", icon: "pi-file-excel" },
    xls:  { kind: "excel", icon: "pi-file-excel" },
    ods:  { kind: "excel", icon: "pi-file-excel" },
    csv:  { kind: "excel", icon: "pi-file-excel" },
  };

  const $ = (id) => document.getElementById(id);
  const items = [];          // { id, file, name, ext, status, md, error }
  let selected = null;
  let view = "src";
  let seq = 0;

  /* ---------------------------------------------------------- utilitaires */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const baseName = (n) => n.replace(/\.[^.]+$/, "");
  const fmtSize = (b) => b < 1024 ? b + " o" : b < 1048576 ? (b / 1024).toFixed(1) + " Ko" : (b / 1048576).toFixed(1) + " Mo";

  const cell = (v) => String(v ?? "").replace(/\s+/g, " ").trim().replace(/\|/g, "\\|");

  function tableToMd(rows) {
    rows = rows.map((r) => r.map(cell)).filter((r) => r.some(Boolean));
    if (!rows.length) return "";
    const w = Math.max(...rows.map((r) => r.length));
    // retire les colonnes entièrement vides
    const keep = [...Array(w).keys()].filter((j) => rows.some((r) => r[j]));
    rows = rows.map((r) => keep.map((j) => r[j] || ""));
    const [head, ...body] = rows;
    return [
      "| " + head.join(" | ") + " |",
      "| " + head.map(() => "---").join(" | ") + " |",
      ...body.map((r) => "| " + r.join(" | ") + " |"),
    ].join("\n");
  }

  /* ----------------------------------------------------------------- Word */
  const turndown = new TurndownService({
    headingStyle: "atx", codeBlockStyle: "fenced", bulletListMarker: "-", emDelimiter: "*",
  });
  turndown.addRule("table", {
    filter: "table",
    replacement: (_c, node) => {
      const ownerTable = (el) => { while (el && el.nodeName !== "TABLE") el = el.parentNode; return el; };
      const rows = Array.from(node.querySelectorAll("tr"))
        .filter((tr) => ownerTable(tr) === node)
        .map((tr) => Array.from(tr.childNodes)
          .filter((c) => c.nodeName === "TD" || c.nodeName === "TH")
          .map((td) => td.textContent));
      return "\n\n" + tableToMd(rows) + "\n\n";
    },
  });
  turndown.addRule("emptyImg", { filter: (n) => n.nodeName === "IMG" && !n.getAttribute("src"), replacement: () => "" });

  async function docxToMd(buf) {
    const { value } = await mammoth.convertToHtml(
      { arrayBuffer: buf },
      { convertImage: mammoth.images.imgElement(() => Promise.resolve({ src: "" })) }
    );
    return turndown.turndown(value)
      .replace(/^(\s*)-\s{2,}/gm, "$1- ")
      .replace(/^(\s*)(\d+\.)\s{2,}/gm, "$1$2 ")
      .replace(/\n{3,}/g, "\n\n").trim() + "\n";
  }

  /* ---------------------------------------------------------------- Excel */
  function sheetToMd(buf, name) {
    const wb = XLSX.read(buf, { type: "array" });
    const out = [`# ${baseName(name)}`];
    for (const sn of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "", raw: false, blankrows: false });
      out.push(`## ${sn}`, tableToMd(rows) || "*(feuille vide)*");
    }
    return out.join("\n\n") + "\n";
  }

  /* ------------------------------------------------------------------ PDF */
  async function pdfToMd(buf) {
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      // Regroupe les fragments en lignes
      const lines = [];
      let cur = null;
      for (const it of tc.items) {
        if (typeof it.str !== "string") continue;
        const y = it.transform[5];
        const h = Math.abs(it.transform[3]) || it.height || 10;
        if (!cur || Math.abs(cur.y - y) > h * 0.5) {
          if (cur) lines.push(cur);
          cur = { y, h, text: "" };
        }
        cur.text += it.str;
        cur.h = Math.max(cur.h, h);
        if (it.hasEOL) { lines.push(cur); cur = null; }
      }
      if (cur) lines.push(cur);
      const clean = lines.map((l) => ({ ...l, text: l.text.replace(/\s+/g, " ").trim() })).filter((l) => l.text);
      if (!clean.length) { pages.push("*(page sans texte extractible, probablement une image scannée)*"); continue; }

      const heights = clean.map((l) => l.h).sort((a, b) => a - b);
      const med = heights[Math.floor(heights.length / 2)];
      const blocks = [];
      let para = [];
      let prevY = null;
      const flush = () => { if (para.length) { blocks.push(para.join(" ").replace(/(\w)- (\w)/g, "$1$2")); para = []; } };
      for (const l of clean) {
        const ratio = l.h / med;
        const gap = prevY === null ? 0 : Math.abs(prevY - l.y);
        if (ratio >= 1.25 && l.text.length < 120) {
          flush();
          blocks.push((ratio >= 1.6 ? "## " : "### ") + l.text);
        } else {
          if (gap > med * 1.9) flush();
          if (/^([-•▪◦*]|\d+[.)])\s/.test(l.text)) { flush(); para.push(l.text.replace(/^[•▪◦*]\s/, "- ")); flush(); }
          else para.push(l.text);
        }
        prevY = l.y;
      }
      flush();
      pages.push(blocks.join("\n\n"));
    }
    return pages.join("\n\n---\n\n") + "\n";
  }

  /* ---------------------------------------------------------- conversion */
  async function convert(item) {
    item.status = "working"; render();
    try {
      const buf = await item.file.arrayBuffer();
      if (item.ext === "pdf") item.md = await pdfToMd(buf);
      else if (item.ext === "docx") item.md = await docxToMd(buf);
      else item.md = sheetToMd(buf, item.name);
      item.status = "done";
      if (!selected) selected = item.id;
    } catch (e) {
      console.error(e);
      item.status = "error";
      item.error = e && e.message ? e.message : "Conversion impossible";
    }
    render();
  }

  function addFiles(fileList) {
    const rejected = [];
    const queue = [];
    for (const f of fileList) {
      const ext = (f.name.split(".").pop() || "").toLowerCase();
      if (!TYPES[ext]) { rejected.push(f.name); continue; }
      const item = { id: ++seq, file: f, name: f.name, ext, status: "pending", md: "", error: "" };
      items.push(item); queue.push(item);
    }
    if (rejected.length) toast(`Format non pris en charge : ${rejected.join(", ")}`, "pi-exclamation-triangle");
    render();
    (async () => { for (const it of queue) await convert(it); })();
  }

  /* ------------------------------------------------------------- actions */
  function download(item) {
    const blob = new Blob([item.md], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), { href: url, download: baseName(item.name) + ".md" });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function copy(item) {
    try { await navigator.clipboard.writeText(item.md); toast("Markdown copié"); }
    catch { toast("Copie impossible dans ce navigateur", "pi-exclamation-triangle"); }
  }

  async function downloadZip() {
    const done = items.filter((i) => i.status === "done");
    if (!done.length) return;
    const zip = new JSZip();
    const used = new Set();
    for (const it of done) {
      let n = baseName(it.name) + ".md", k = 2;
      while (used.has(n)) n = `${baseName(it.name)} (${k++}).md`;
      used.add(n); zip.file(n, it.md);
    }
    const blob = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), { href: url, download: "markdown.zip" });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function remove(id) {
    const i = items.findIndex((x) => x.id === id);
    if (i >= 0) items.splice(i, 1);
    if (selected === id) selected = (items.find((x) => x.status === "done") || {}).id || null;
    render();
  }

  let toastTimer;
  function toast(msg, icon = "pi-check") {
    const t = $("toast");
    t.querySelector("i").className = "pi " + icon;
    t.querySelector("span").textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  /* --------------------------------------------------------------- rendu */
  function statusHtml(it) {
    switch (it.status) {
      case "pending": return `<i class="pi pi-clock"></i>En attente`;
      case "working": return `<i class="pi pi-spin pi-spinner"></i>Conversion…`;
      case "done": return `<i class="pi pi-check-circle ok"></i><span>Converti · ${fmtSize(new Blob([it.md]).size)}</span>`;
      case "error": return `<i class="pi pi-times-circle err"></i><span class="err">${esc(it.error)}</span>`;
    }
  }

  function render() {
    $("files-card").classList.toggle("hidden", !items.length);
    $("count").textContent = items.length ? `(${items.length})` : "";
    $("zip").disabled = !items.some((i) => i.status === "done");

    $("list").innerHTML = items.map((it) => {
      const t = TYPES[it.ext];
      const ok = it.status === "done";
      return `<li class="file${selected === it.id ? " active" : ""}" data-id="${it.id}">
        <div class="ficon ${t.kind}"><i class="pi ${t.icon}"></i></div>
        <div class="fmain">
          <div class="fname" title="${esc(it.name)}">${esc(it.name)}</div>
          <div class="fmeta">${fmtSize(it.file.size)} <span>·</span> ${statusHtml(it)}</div>
        </div>
        <div class="fact">
          <button class="icon-btn" data-act="copy" title="Copier le Markdown" aria-label="Copier" ${ok ? "" : "disabled"}><i class="pi pi-copy"></i></button>
          <button class="icon-btn" data-act="dl" title="Télécharger le .md" aria-label="Télécharger" ${ok ? "" : "disabled"}><i class="pi pi-download"></i></button>
          <button class="icon-btn danger" data-act="rm" title="Retirer" aria-label="Retirer"><i class="pi pi-times"></i></button>
        </div>
      </li>`;
    }).join("");

    const sel = items.find((i) => i.id === selected && i.status === "done");
    $("preview-card").classList.toggle("hidden", !sel);
    if (sel) {
      $("preview-name").textContent = baseName(sel.name) + ".md";
      $("source").textContent = sel.md;
      $("source").classList.toggle("hidden", view !== "src");
      $("rendered").classList.toggle("hidden", view !== "render");
      if (view === "render") $("rendered").innerHTML = DOMPurify.sanitize(marked.parse(sel.md));
      $("tab-src").classList.toggle("on", view === "src");
      $("tab-render").classList.toggle("on", view === "render");
    }
  }

  /* ----------------------------------------------------------- événements */
  const drop = $("drop"), input = $("input");
  input.addEventListener("change", () => { addFiles(input.files); input.value = ""; });
  drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
  // Empêche le navigateur d'ouvrir un fichier lâché hors de la zone
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  $("list").addEventListener("click", (e) => {
    const li = e.target.closest(".file"); if (!li) return;
    const id = Number(li.dataset.id);
    const it = items.find((x) => x.id === id);
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "copy") return copy(it);
    if (act === "dl") return download(it);
    if (act === "rm") return remove(id);
    if (it.status === "done") { selected = id; render(); }
  });

  $("clear").addEventListener("click", () => { items.length = 0; selected = null; render(); });
  $("zip").addEventListener("click", downloadZip);
  $("tab-src").addEventListener("click", () => { view = "src"; render(); });
  $("tab-render").addEventListener("click", () => { view = "render"; render(); });
  $("p-copy").addEventListener("click", () => copy(items.find((i) => i.id === selected)));
  $("p-dl").addEventListener("click", () => download(items.find((i) => i.id === selected)));
})();
</script>
</body>
</html>
